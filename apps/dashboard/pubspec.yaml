name: jsh_service_dashboard
description: داشبورد تعمیرات و خدمات — سامانه مدیریت فروشگاه تعمیرات موبایل و لوازم الکتریکی (پروژه J.S.H)
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # پایگاه‌داده محلی SQLite (ویندوز + اندروید)
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0
  # ایمیل SMTP + پیوست PDF و تقویم
  mailer: ^6.1.2
  # ساخت PDF رسید با فونت فارسی
  pdf: ^3.11.1
  # تقویم شمسی
  shamsi_date: ^1.0.4
  intl: ^0.19.0
  crypto: ^3.0.3
  # امضای مشتری روی پد لمسی
  signature: ^5.5.0
  # اعلان دسکتاپ ویندوز
  local_notifier: ^0.1.6
  # انتخاب پوشه بک‌آپ
  file_selector: ^1.0.3

dependency_overrides:
  # image 4.11 به archive جدیدتر با decodeLazy نیاز دارد
  archive: ^4.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  path_provider_platform_interface: ^2.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
