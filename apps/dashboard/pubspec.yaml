name: jsh_service_dashboard
description: داشبورد تعمیرات و خدمات — سامانه مدیریت فروشگاه تعمیرات موبایل و لوازم الکتریکی (پروژه J.S.H)
publish_to: "none"
version: 0.14.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # موتور کد فعال‌سازی — مشترک با برنامه جانبی تولید کد (فاز ۱)
  activation_core:
    path: ../../packages/activation_core
  # شناسه دستگاه اندروید (ANDROID_ID) برای فعال‌سازی — فاز ۱
  android_id: ^0.4.0
  device_info_plus: ^10.1.2
  # پایگاه‌داده محلی SQLite (ویندوز + اندروید)
  sqflite_common_ffi: ^2.3.3
  # کتابخانه بومی sqlite3 برای اندروید/ویندوز — بدون آن FFI روی اندروید کرش می‌کند
  sqlite3_flutter_libs: ^0.5.38
  path_provider: ^2.1.4
  path: ^1.9.0
  # ساخت PDF رسید با فونت فارسی
  pdf: ^3.11.1
  # تولید کد QR روی سفارش/پیش‌فاکتور/فاکتور — فاز ۵ (بند ۶ جدید)
  qr_flutter: ^4.1.0
  # تقویم شمسی
  shamsi_date: ^1.0.4
  intl: ^0.19.0
  crypto: ^3.0.3
  # امضای مشتری روی پد لمسی
  signature: ^5.5.0
  # اعلان دسکتاپ ویندوز
  local_notifier: ^0.1.6
  # انتخاب پوشه بک‌آپ
  file_selector: ^1.0.3
  # اتچ عکس با دوربین/گالری گوشی — فاز ۶ب (بند ۱۰)
  image_picker: ^1.1.2
  # اسکن بارکد/QR سفارش با دوربین — فاز ۶ب (بند ۱۰)؛ فقط موبایل
  mobile_scanner: ^5.2.3

dependency_overrides:
  # image 4.11 به archive جدیدتر با decodeLazy نیاز دارد
  archive: ^4.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  path_provider_platform_interface: ^2.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
