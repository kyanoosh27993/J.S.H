name: J.S.H Build

# فاز ۲ و ۳ نقشه راه:
#  • هر پوش به main → تست کامل flutter test (فاز ۲)
#  • هر تگ v* → بیلد Windows exe + Android APK و انتشار Release (فاز ۳)
#  • اجرای دستی هم ممکن است (workflow_dispatch)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# مجوز ساخت Release — بدون این، انتشار با 403 «Resource not accessible» شکست می‌خورد
permissions:
  contents: write

jobs:
  flutter-test:
    name: تست‌های Flutter (فاز ۲)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
      # تست‌های golden (مقایسه پیکسلی) وابسته به رندر ماشین مرجع‌اند و فقط آنجا اجرا می‌شوند
      - run: flutter test --exclude-tags=golden

  license-core-test:
    name: تست موتور فعال‌سازی + مولد کد
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: تست بسته هسته فعال‌سازی
        working-directory: packages/activation_core
        run: |
          flutter pub get
          flutter test
      - name: تست برنامه جانبی مولد
        working-directory: apps/license_gen
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings || true
          flutter test

  build-windows:
    name: بیلد Windows exe (فاز ۳)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: بسته‌بندی exe
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath $env:GITHUB_WORKSPACE\jsh-windows-x64.zip -Force
      - name: انتشار در Release
        uses: softprops/action-gh-release@v2
        with:
          files: jsh-windows-x64.zip
          fail_on_unmatched_files: true

  build-license-gen:
    name: بیلد مولد کد فعال‌سازی — Windows exe (فاز ۱ نسخه ۲)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/license_gen
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: بسته‌بندی exe
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath $env:GITHUB_WORKSPACE\jsh-license-gen-windows-x64.zip -Force
      - name: انتشار در Release
        uses: softprops/action-gh-release@v2
        with:
          files: jsh-license-gen-windows-x64.zip
          fail_on_unmatched_files: true

  build-android:
    name: بیلد Android APK (فاز ۳)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # نسخه سازگار با Gradle 8.12 / AGP 8.9.1 پروژه — 3.50 حداقل Gradle 9.3.1 می‌خواهد
          flutter-version: 3.35.0
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - name: تغییر نام APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/jsh-android.apk"
      - name: انتشار در Release
        uses: softprops/action-gh-release@v2
        with:
          files: jsh-android.apk
          fail_on_unmatched_files: true
